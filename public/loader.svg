<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="130" height="130" role="img" aria-label="Adoptimize loading" xmlns:c2pa="http://c2pa.org/manifest">
<title>Adoptimize</title>
<style>
.tile{transform-box:fill-box;transform-origin:center;animation:breathe 2.8s ease-in-out infinite}
.a,.arrow,.head{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.a{stroke:#FFFFFF;stroke-width:12;animation:drawA 2.8s ease-in-out infinite}
.arrow{stroke:#FBBF24;stroke-width:7;animation:drawArrow 2.8s ease-in-out infinite}
.head{stroke:#FBBF24;stroke-width:7;animation:drawHead 2.8s ease-in-out infinite}
.spark{fill:#FCD34D;transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop 2.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes drawA{0%,5%{stroke-dashoffset:1;opacity:1}40%,86%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes drawArrow{0%,32%{stroke-dashoffset:1;opacity:1}56%,86%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes drawHead{0%,54%{stroke-dashoffset:1;opacity:1}62%,86%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes pop{0%,58%{transform:scale(0);opacity:1}68%{transform:scale(1.35) rotate(20deg)}74%{transform:scale(1) rotate(0)}80%{transform:scale(1.15)}86%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.tile,.a,.arrow,.head,.spark{animation:none}.a,.arrow,.head{stroke-dashoffset:0}.spark{transform:scale(1)}}
</style>
<g class="tile">
<rect width="130" height="130" rx="30" fill="#6D28D9"/>
<polyline class="a" pathLength="1" points="30,102 65,30 100,102"/>
<polyline class="arrow" pathLength="1" points="44,86 62,70 72,78 90,58"/>
<polyline class="head" pathLength="1" points="79,56 91,56 91,68"/>
<path class="spark" d="M104 18 L107 26 L115 29 L107 32 L104 40 L101 32 L93 29 L101 26 Z"/>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
