<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="adoptimize-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3de36c" />
      <stop offset="45%" stop-color="#2ecc5f" />
      <stop offset="100%" stop-color="#16a848" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Green Squircle App Icon Background -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#adoptimize-bg)" />

  <!-- Trending Graph Arrow with Shadow -->
  <g filter="url(#subtle-shadow)">
    <!-- Main Trend Line -->
    <path
      d="M 145 315 C 180 270, 205 245, 226 245 C 247 245, 257 280, 276 280 C 298 280, 330 240, 362 200"
      fill="none"
      stroke="#000000"
      stroke-width="34"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Arrow Head -->
    <path
      d="M 302 196 L 364 196 L 364 258"
      fill="none"
      stroke="#000000"
      stroke-width="34"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
